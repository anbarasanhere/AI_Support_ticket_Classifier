<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Ticket Classifier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1c1914;
      --muted: #6b6258;
      --paper: #f4efe6;
      --card: #fffaf3;
      --line: #e0d6c8;
      --accent: #c45c26;
      --accent-dark: #9a3f14;
      --forest: #2f4f3e;
    }

    body {
      background:
        radial-gradient(1200px 500px at 10% -10%, #fbe7d4 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #dce8df 0%, transparent 50%),
        var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2.25rem 2.5rem 1.25rem;
      display: flex;
      align-items: baseline;
      gap: 1.25rem;
      flex-wrap: wrap;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }
    header svg { display: none; }
    header h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--ink);
    }
    header span {
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      border-left: 2px solid var(--accent);
      padding-left: 0.9rem;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 1.25rem;
      padding: 0 2.5rem 1.5rem;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      .main { grid-template-columns: 1fr; padding: 0 1.25rem 1.25rem; }
      header { padding: 1.5rem 1.25rem 1rem; }
      .status-strip { margin: 0 1.25rem 1.25rem; }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px 28px 4px 28px;
      padding: 1.6rem 1.6rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 8px 10px 0 rgba(28, 25, 20, 0.06);
    }

    .panel-title {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.15rem;
      font-weight: 500;
      text-transform: none;
      letter-spacing: -0.02em;
      color: var(--ink);
      padding-bottom: 0.7rem;
      border-bottom: 1px dashed var(--line);
    }

    .samples { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .sample-btn {
      background: transparent;
      border: 1.5px solid var(--ink);
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .sample-btn:hover { background: var(--ink); color: var(--paper); }

    textarea {
      width: 100%;
      flex: 1;
      min-height: 200px;
      background: #f8f3ea;
      border: 0;
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.65;
      padding: 0.9rem 1.05rem;
      resize: vertical;
      outline: none;
      transition: box-shadow 0.15s;
    }
    textarea:focus { box-shadow: inset 0 0 0 1px var(--accent); }
    textarea::placeholder { color: #9a9084; }

    .controls { display: flex; gap: 0.75rem; align-items: stretch; }

    select {
      background: var(--card);
      border: 1.5px solid var(--ink);
      color: var(--ink);
      padding: 0.55rem 0.8rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      min-width: 8.5rem;
    }

    .classify-btn {
      flex: 1;
      background: var(--accent);
      border: none;
      color: #fffaf3;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .classify-btn:hover { background: var(--accent-dark); }
    .classify-btn:active { transform: scale(0.98); }
    .classify-btn:disabled { background: #cbbfb0; cursor: not-allowed; color: #7a7168; }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
    }

    .card {
      background: #f8f3ea;
      border: 0;
      border-radius: 16px;
      padding: 0.9rem 1rem;
    }
    .card-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .card-value {
      font-family: Fraunces, Georgia, serif;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--ink);
    }

    .card-wide { grid-column: 1 / -1; }

    .badge {
      display: inline-block;
      padding: 0.22rem 0.7rem;
      border-radius: 4px;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .priority-low    { background: #d9efe0; color: #1f5c3a; }
    .priority-medium { background: #f7e3b8; color: #7a4d08; }
    .priority-high   { background: #f3d0b8; color: #8a3410; }
    .priority-critical { background: #f3c9c6; color: #8a1f1a; }

    .sentiment-positive { background: #d9efe0; color: #1f5c3a; }
    .sentiment-neutral  { background: #d7e4f4; color: #1d4a7a; }
    .sentiment-negative { background: #f7e3b8; color: #7a4d08; }
    .sentiment-angry    { background: #f3c9c6; color: #8a1f1a; }

    .confidence-bar-wrap {
      display: block;
      width: 100%;
      background: #e7ddd0;
      border-radius: 4px;
      height: 10px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .confidence-bar {
      display: block;
      height: 10px;
      width: 0;
      min-height: 10px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--forest), var(--accent));
      transition: width 0.4s ease;
    }

    .status-strip {
      max-width: 1280px;
      width: calc(100% - 5rem);
      margin: 0 auto 1.75rem;
      background: var(--ink);
      color: #d8cfc3;
      border-radius: 999px;
      padding: 0.7rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 1.75rem;
      font-size: 0.78rem;
      flex-wrap: wrap;
    }
    .status-item { display: flex; align-items: center; gap: 0.4rem; }
    .status-item span.label { color: #8d8478; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.68rem; }
    .status-item span.value { color: #f4efe6; font-weight: 600; }
    .pii-badge { color: #ff8a7a; font-weight: 700; }
    .pii-clean { color: #8fd4a4; font-weight: 700; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #fffaf355;
      border-top-color: #fffaf3;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 0.4rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      background: #f8e4e1;
      border: 1px solid #d97a72;
      color: #8a1f1a;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--muted);
      gap: 0.65rem;
      text-align: center;
      padding: 2rem;
    }
    .empty-state svg { opacity: 0.45; color: var(--accent); }
    .empty-state p { font-size: 0.9rem; max-width: 16rem; }

    .human-review-flag {
      background: #f7e3b8;
      border: 0;
      color: #7a4d08;
      border-radius: 12px;
      padding: 0.55rem 0.85rem;
      font-size: 0.82rem;
      font-weight: 600;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" fill="none" viewBox="0 0 24 24">
    <path stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>
  </svg>
  <h1>Support Ticket Classifier</h1>
  <span>LangGraph + GPT-4o-mini</span>
</header>

<div class="main">

  <!-- LEFT: Input Panel -->
  <div class="panel">
    <div class="panel-title">Ticket Input</div>

    <div class="samples">
      <button class="sample-btn" onclick="fillSample(0)">📦 Delayed Delivery</button>
      <button class="sample-btn" onclick="fillSample(1)">💳 Double Charged</button>
      <button class="sample-btn" onclick="fillSample(2)">🔐 Login Broken</button>
    </div>

    <textarea id="ticketText" placeholder="Paste or type a customer support ticket here…"></textarea>

    <div class="controls">
      <select id="channel">
        <option value="web_form">Web Form</option>
        <option value="email">Email</option>
      </select>
      <button class="classify-btn" id="classifyBtn" onclick="classify()">Classify Ticket</button>
    </div>
  </div>

  <!-- RIGHT: Results Panel -->
  <div class="panel" id="resultsPanel">
    <div class="panel-title">Classification Result</div>
    <div class="empty-state" id="emptyState">
      <svg width="48" height="48" fill="none" viewBox="0 0 24 24">
        <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      <p>Submit a ticket to see the classification result</p>
    </div>
    <div class="result-grid" id="resultGrid" style="display:none;"></div>
  </div>

</div>

<!-- BOTTOM: Status strip -->
<div class="status-strip" id="statusStrip">
  <div class="status-item">
    <span class="label">Tokens</span>
    <span class="value" id="statusTokens">—</span>
  </div>
  <div class="status-item">
    <span class="label">Cost</span>
    <span class="value" id="statusCost">—</span>
  </div>
  <div class="status-item">
    <span class="label">PII</span>
    <span class="value" id="statusPii">—</span>
  </div>
  <div class="status-item">
    <span class="label">Prompt</span>
    <span class="value" id="statusPrompt">—</span>
  </div>
</div>

<script>
const SAMPLES = [
  {
    channel: "web_form",
    text: "I am absolutely furious! My package was supposed to arrive 5 days ago and it still hasn't shown up. I've been waiting at home all week. This is completely unacceptable. Order #98765. I want an immediate update or a full refund!\nEmail: sanjay@xyzmail.com \nCredit card number: 1234567890123456",
  },
  {
    channel: "email",
    text: "Subject: Double charge on my account\n\nHello,\n\nI noticed I was charged twice for the same order (#44321) placed on March 15th. Both charges of $89.99 appear on my bank statement. Please refund one of the charges immediately. This is very concerning.\n\nThank you,\nA frustrated customer",
  },
  {
    channel: "web_form",
    text: "I can't log into my account at all. I keep getting 'Invalid credentials' even though I just reset my password 3 times. I need to access my order history urgently. Please help — I've been locked out for 2 days.",
  },
];

function fillSample(index) {
  const s = SAMPLES[index];
  document.getElementById("ticketText").value = s.text;
  document.getElementById("channel").value = s.channel;
}

function priorityClass(p) {
  return { low: "priority-low", medium: "priority-medium", high: "priority-high", critical: "priority-critical" }[p] || "";
}
function sentimentClass(s) {
  return { positive: "sentiment-positive", neutral: "sentiment-neutral", negative: "sentiment-negative", angry: "sentiment-angry" }[s] || "";
}
function formatCategory(s) {
  return s.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}

async function classify() {
  const text = document.getElementById("ticketText").value.trim();
  if (!text) { alert("Please enter a ticket."); return; }

  const btn = document.getElementById("classifyBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Classifying…';

  document.getElementById("emptyState").style.display = "flex";
  document.getElementById("resultGrid").style.display = "none";

  try {
    const resp = await fetch("http://localhost:8000/classify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticket_text: text, channel: document.getElementById("channel").value }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || resp.statusText);
    }

    const data = await resp.json();
    renderResult(data);
  } catch (e) {
    document.getElementById("emptyState").innerHTML =
      `<div class="error-msg">Error: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Classify Ticket";
  }
}

function confidencePercent(score) {
  const n = Number(score);
  if (!Number.isFinite(n) || n < 0) return 0;
  return Math.round(n <= 1 ? n * 100 : Math.min(n, 100));
}

function renderResult(d) {
  const grid = document.getElementById("resultGrid");
  const confPct = confidencePercent(d.confidence_score);

  grid.innerHTML = `
    <div class="card">
      <div class="card-label">Category</div>
      <div class="card-value">${formatCategory(d.issue_category)}</div>
    </div>
    <div class="card">
      <div class="card-label">Assigned Team</div>
      <div class="card-value">${formatCategory(d.assigned_team)}</div>
    </div>
    <div class="card">
      <div class="card-label">Priority</div>
      <div class="card-value">
        <span class="badge ${priorityClass(d.priority)}">${d.priority.toUpperCase()}</span>
      </div>
    </div>
    <div class="card">
      <div class="card-label">Sentiment</div>
      <div class="card-value">
        <span class="badge ${sentimentClass(d.user_sentiment)}">${d.user_sentiment.toUpperCase()}</span>
      </div>
    </div>
    <div class="card card-wide">
      <div class="card-label">Confidence Score — ${confPct}%</div>
      <div class="confidence-bar-wrap">
        <div class="confidence-bar" style="width:${confPct}%"></div>
      </div>
    </div>
    <div class="card card-wide">
      <div class="card-label">Reasoning</div>
      <div class="card-value" style="font-weight:400;font-size:0.88rem;line-height:1.5">${d.reasoning}</div>
    </div>
    ${d.requires_human_review ? '<div class="human-review-flag">⚠ Flagged for human review</div>' : ""}
    ${d.injection_blocked ? '<div class="human-review-flag" style="color:#f87171;border-color:#991b1b">🚫 Injection attempt blocked</div>' : ""}
  `;

  // Status strip
  const cost = d.cost_info;
  document.getElementById("statusTokens").textContent =
    cost ? `${cost.input_tokens} in / ${cost.output_tokens} out` : "—";
  document.getElementById("statusCost").textContent =
    cost ? `$${cost.total_cost_usd.toFixed(6)}` : "—";
  document.getElementById("statusPii").innerHTML =
    d.pii_detected
      ? '<span class="pii-badge">PII DETECTED</span>'
      : '<span class="pii-clean">Clean</span>';
  document.getElementById("statusPrompt").textContent = d.prompt_version || "—";

  document.getElementById("emptyState").style.display = "none";
  grid.style.display = "grid";
}
</script>
</body>
</html>
